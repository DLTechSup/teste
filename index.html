    <script>
      // Compatibility shim for browser extensions (e.g. ImageAssistant / Inspector)
      // that attempt to assign window.fetch when it only has a getter.
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If fetch cannot be redefined, proceed gracefully
        }

        // Suppress unhandled errors originating from external browser extensions
        window.addEventListener('error', function(e) {
          if (
            (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
